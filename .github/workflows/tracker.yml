name: Job Tracker

on:
  schedule:
    # Times are UTC. 03:30, 07:30, 11:30 and 15:30 UTC are
    # 9:00 AM, 1:00 PM, 5:00 PM and 9:00 PM IST.
    - cron: "30 3,7,11,15 * * *"
  workflow_dispatch: # adds a "Run workflow" button (works from the GitHub mobile app)

permissions:
  contents: write # lets the run commit seen_jobs.json back

concurrency:
  group: job-tracker # never run two checks at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o job-tracker .

      - name: Check for new jobs
        run: ./job-tracker -once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
