name: Job Tracker

on:
  schedule:
    # Times are UTC. 03:43, 07:43, 11:43 and 15:43 UTC are
    # 9:13 AM, 1:13 PM, 5:13 PM and 9:13 PM IST. An odd minute, because
    # GitHub delays or skips scheduled runs at :00 and :30 when busy.
    - cron: "43 3,7,11,15 * * *"
  workflow_dispatch: # adds a "Run workflow" button (works from the GitHub mobile app)

permissions:
  contents: write # lets the run commit seen_jobs.json back

concurrency:
  group: job-tracker # never run two checks at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o job-tracker .

      - name: Check for new jobs
        run: ./job-tracker -once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
